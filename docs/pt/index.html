<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="qft8-redirect" content="pt-br pt-pt">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qFT8 - Português</title>
    <link rel="canonical" href="https://qft8.com/pt-br/">
    <script>
        (function () {
            var wanted = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
            var target = "pt-br";
            for (var i = 0; i < wanted.length; i++) {
                var tag = String(wanted[i] || "").toLowerCase();
                if (tag.split("-")[0] === "pt") { target = (tag === "pt" || tag === "pt-br") ? "pt-br" : "pt-pt"; break; }
            }
            var p = location.pathname, f = p.substring(p.lastIndexOf("/") + 1);
            location.replace("../" + target + "/" + (/\.[A-Za-z0-9]+$/.test(f) ? f : "") + location.search + location.hash);
        })();
    </script>
</head>
<body>
    <p><a href="../pt-br/">Português (Brasil)</a> - <a href="../pt-pt/">Português (Portugal)</a></p>
</body>
</html>
